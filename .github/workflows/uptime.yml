# Checks every 6 hours that key pages of the live site respond. A failed run triggers GitHub's
# normal failure e-mail to the repository owner. Set the SITE_URL repository secret to enable it.
name: Uptime
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check pages
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "::warning::SITE_URL secret not set — skipping"; exit 0; fi
          for p in / /where-to-go-in-january/ /destinations/ /best-time-to-visit-hawaii/ /sitemap-index.xml /api/destinations.json; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$SITE_URL$p")
            echo "$code $p"
            [ "$code" = "200" ] || exit 1
          done
